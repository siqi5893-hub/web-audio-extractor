<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通用网页音频提取器</title><style>:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f172a}main{width:min(520px,calc(100% - 40px));padding:30px;border-radius:22px;background:#1e293b;box-shadow:0 20px 60px #0006}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:10px;border:1px solid #64748b;font:inherit}label{display:block;margin:18px 0 7px}button{margin-top:22px;border:0;background:#38bdf8;color:#082f49;font-weight:700}small{color:#94a3b8}</style></head><body><main><h1>通用网页音频提取器</h1><p><small>粘贴公开网页链接，由通用提取引擎或站点适配器生成 MP3。</small></p><form method="post" action="/extract"><label for="url">公开网页链接</label><input id="url" name="url" type="url" maxlength="2048" required placeholder="https://…">{% if token_required %}<label for="token">访问令牌</label><input id="token" name="token" type="password" required>{% endif %}<button type="submit">提取 MP3</button></form><p><small>仅处理你有权保存的公开内容，不绕过 DRM、付费或权限控制。</small></p></main></body></html>
